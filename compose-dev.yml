services:
  nats:
    image: nats:2.10
    expose:
      - "4222"
    ports:
      - "8222:8222"
      - "4222:4222"
    command: "--http_port 8222 -js"

  db:
    image: postgres:16
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: testing
    volumes:
      - pgdata:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:3.7
    ports:
      - 4566:4566
    volumes:
      - ./scripts/localstack/setup.sh:/etc/localstack/init/ready.d/script.sh

volumes:
  pgdata:
